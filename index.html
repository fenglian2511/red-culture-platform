<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#8B0000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="桂医红色文化">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>广西红色文化积极心理资源检索工具</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","微软雅黑",sans-serif;background:#f5f5f5;color:#333;line-height:1.6;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
/* Header */
.site-header{background:linear-gradient(135deg,#8B0000 0%,#C0392B 100%);color:white;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,0.15);position:sticky;top:0;z-index:100}
.header-inner{max-width:1200px;margin:0 auto}
.site-title{font-size:1.15rem;font-weight:700;margin:0;letter-spacing:.5px;display:flex;align-items:center;gap:10px}
.site-logo{width:40px;height:40px;border-radius:50%;background:white;padding:2px;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,0.2)}
.site-subtitle{font-size:.75rem;margin:4px 0 0;color:#FFD700;opacity:.95}
/* Search */
.search-bar{background:white;padding:12px 16px;border-bottom:1px solid #eee;position:sticky;top:68px;z-index:99}
.search-input-wrap{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:8px;background:#f9f9f9;border:2px solid #e0e0e0;border-radius:24px;padding:2px 4px 2px 16px;transition:border-color .2s}
.search-input-wrap:focus-within{border-color:#8B0000}
.search-icon{font-size:1.1rem;flex-shrink:0}
.search-input{flex:1;border:none;background:transparent;padding:10px 0;font-size:.95rem;outline:none;color:#333;min-width:0}
.search-btn{background:#C0392B;color:white;border:none;padding:8px 20px;border-radius:20px;font-size:.9rem;font-weight:600;cursor:pointer;transition:background .2s;flex-shrink:0}
.search-btn:hover{background:#A93226}
/* Filter toggle */
.filter-toggle-bar{display:block;background:white;padding:10px 16px;border-bottom:1px solid #eee}
.filter-toggle-btn{width:100%;background:#fff8f8;border:1px solid #E8C5C5;color:#8B0000;padding:10px 14px;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
.filter-count{background:#C0392B;color:white;font-size:.75rem;padding:2px 8px;border-radius:10px;margin-left:8px}
/* Layout */
.main-layout{max-width:1200px;margin:0 auto;padding:12px;display:block}
/* Filter panel */
.filter-panel{background:white;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,0.06);display:none}
.filter-panel.show{display:block}
.filter-section{margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid #f0f0f0}
.filter-section:last-of-type{border-bottom:none}
.filter-title{font-size:1rem;font-weight:700;color:#8B0000;margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid #FFE4E1}
/* City grid */
.city-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.city-chip{display:block;text-align:center;padding:10px 8px;background:#f9f9f9;border:1.5px solid #e0e0e0;border-radius:8px;font-size:.85rem;color:#555;font-weight:500;transition:all .2s;cursor:pointer}
.city-chip:hover{border-color:#C0392B;color:#8B0000}
.city-chip.active{background:#C0392B;color:white;border-color:#C0392B}
.city-chip.guilin{background:#FFF5F5;border-color:#FFB3B3;color:#8B0000;font-weight:700}
.city-chip.guilin.active{background:#8B0000;color:white}
/* Type grid */
.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.type-chip{display:block;text-align:center;padding:10px 6px;background:#f9f9f9;border:1.5px solid #e0e0e0;border-radius:8px;font-size:.8rem;color:#555;font-weight:500;transition:all .2s;cursor:pointer}
.type-chip:hover{border-color:#C0392B;color:#8B0000}
.type-chip.active{background:#C0392B;color:white;border-color:#C0392B}
/* Card type tag */
.card-type-tag{background:#E8F5E9;color:#2E7D32;font-size:.7rem;padding:2px 8px;border-radius:4px}
.tag-type{background:#E8F5E9;color:#2E7D32;font-size:.75rem;padding:3px 10px;border-radius:10px}
/* Category list */
.category-list{display:flex;flex-direction:column;gap:6px}
.category-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#f9f9f9;border-radius:8px;cursor:pointer;transition:background .2s;font-size:.85rem}
.category-item:hover{background:#FFF0F0}
.category-item input{width:16px;height:16px;accent-color:#C0392B;cursor:pointer;flex-shrink:0}
.category-item:has(input:checked){background:#FFE4E1;color:#8B0000;font-weight:600}
/* Quality grid */
.quality-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.quality-item{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#f9f9f9;border-radius:6px;font-size:.8rem;cursor:pointer;transition:background .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quality-item:hover{background:#FFF0F0}
.quality-item input{width:14px;height:14px;accent-color:#C0392B;flex-shrink:0}
.quality-item:has(input:checked){background:#FFE4E1;color:#8B0000;font-weight:600}
/* Reset */
.reset-btn{width:100%;padding:12px;background:#C0392B;color:white;border:none;border-radius:8px;font-size:.95rem;font-weight:600;cursor:pointer;transition:background .2s}
.reset-btn:hover{background:#A93226}
/* Results */
.results-area{min-height:300px}
.results-header{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:4px 0 12px}
.results-count{font-size:.95rem;color:#555}
.results-count strong{color:#8B0000;font-size:1.2rem}
.filter-tag{background:#FFE4E1;color:#8B0000;padding:4px 10px;border-radius:12px;font-size:.8rem}
/* Cards */
.result-cards{display:flex;flex-direction:column;gap:12px}
.result-card{background:white;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,0.06);transition:transform .2s,box-shadow .2s;display:block;border:1px solid #eee;position:relative;overflow:hidden;cursor:pointer}
.result-card.key-resource{border-color:#8B0000;border-width:2px;background:linear-gradient(135deg,#fff 0%,#fff8f8 100%)}
.result-card:active{transform:scale(.98)}
.card-header{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.card-city{font-size:.85rem;font-weight:600;color:#C0392B}
.card-key-tag{background:#FFD700;color:#8B0000;font-size:.7rem;font-weight:700;padding:2px 6px;border-radius:4px}
.card-cat-tag{background:#FFF3E0;color:#E65100;font-size:.7rem;padding:2px 8px;border-radius:4px}
.card-title{font-size:1.15rem;font-weight:700;color:#333;margin:0 0 4px}
.card-event{font-size:.8rem;color:#888;margin:0 0 10px}
.card-qualities{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.quality-tag{background:#E74C3C;color:white;font-size:.75rem;padding:3px 8px;border-radius:10px}
.quality-tag.more{background:#999}
.card-desc{font-size:.85rem;color:#666;margin:0 0 10px;line-height:1.5}
.card-action{display:inline-block;color:#C0392B;font-weight:600;font-size:.9rem}
/* No results */
.no-results{text-align:center;padding:60px 20px;background:white;border-radius:12px}
.no-results-icon{font-size:3rem;margin-bottom:12px}
.no-results h3{color:#555;margin:0 0 8px}
.no-results p{color:#999;font-size:.9rem;margin:0}
/* Detail */
.detail-nav{max-width:800px;margin:0 auto;padding:12px 16px 0;display:flex;align-items:center;gap:12px}
.back-btn{display:inline-block;background:#C0392B;color:white;padding:8px 18px;border-radius:20px;font-size:.9rem;font-weight:600;cursor:pointer;border:none}
.breadcrumb{font-size:.8rem;color:#888}
.breadcrumb .sep{margin:0 4px;color:#ccc}
.detail-header{max-width:800px;margin:12px auto 0;background:linear-gradient(135deg,#8B0000 0%,#C0392B 100%);color:white;padding:24px 20px;border-radius:12px}
.detail-header.key-header{background:linear-gradient(135deg,#8B0000 0%,#B22222 50%,#C0392B 100%)}
.detail-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tag-city{background:rgba(255,255,255,0.2);padding:4px 10px;border-radius:12px;font-size:.85rem}
.tag-key{background:#FFD700;color:#8B0000;font-weight:700;padding:4px 10px;border-radius:12px;font-size:.8rem}
.tag-cat{background:#FFE4E1;color:#8B0000;padding:4px 10px;border-radius:12px;font-size:.8rem}
.detail-title{font-size:1.5rem;font-weight:700;margin:0 0 8px;line-height:1.3}
.detail-event{font-size:.95rem;margin:0;opacity:.85}
.detail-body{max-width:800px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.detail-card{background:white;border-radius:12px;padding:18px 16px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.interp-section{margin-bottom:14px}
.interp-section:last-child{margin-bottom:0}
.interp-label{font-size:.8rem;font-weight:700;color:#8B0000;margin:0 0 4px;padding:2px 10px;background:#FFF3E0;border-radius:4px;display:inline-block}
.card-h{font-size:1.05rem;font-weight:700;color:#8B0000;margin:0 0 12px}
.card-line{height:2px;background:#FFE4E1;margin-bottom:12px;border-radius:1px}
.card-line.gold{background:#FFD700}
.card-text{font-size:.95rem;color:#555;line-height:1.8;margin:0}
.gold-card{border:2px solid #FFD700;background:linear-gradient(135deg,#fff 0%,#FFFEF5 100%)}
.qual-cloud{display:flex;flex-wrap:wrap;gap:8px}
.qual-badge{background:#E74C3C;color:white;padding:6px 14px;border-radius:16px;font-size:.85rem;font-weight:600;transition:background .2s}
.qual-badge:hover{background:#922B21}
.related-list{display:flex;flex-direction:column;gap:8px}
.related-item{display:flex;align-items:center;gap:10px;padding:12px;background:#f9f9f9;border-radius:8px;transition:background .2s;cursor:pointer}
.related-item:hover{background:#FFF0F0}
.related-site{font-size:.95rem;font-weight:600;color:#333;flex-shrink:0}
.related-meta{font-size:.75rem;color:#888;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.related-arrow{color:#C0392B;font-weight:700;flex-shrink:0}
.detail-actions{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.action-btn{display:block;text-align:center;padding:14px;border-radius:10px;font-size:.95rem;font-weight:600;transition:all .2s;cursor:pointer;border:none}
.action-btn.primary{background:#C0392B;color:white}
.action-btn.primary:hover{background:#A93226}
.action-btn.secondary{background:white;color:#C0392B;border:2px solid #C0392B}
.action-btn.secondary:hover{background:#FFE4E1}
/* Footer */
.site-footer{text-align:center;padding:20px 16px;color:#999;font-size:.8rem;border-top:1px solid #eee;margin-top:20px}
.site-footer p{margin:0}
/* Responsive */
@media(min-width:600px){
.site-title{font-size:1.35rem}
.site-subtitle{font-size:.85rem}
.city-grid{grid-template-columns:repeat(3,1fr)}
.quality-grid{grid-template-columns:repeat(3,1fr)}
.search-btn{padding:10px 28px}
.result-card{padding:20px}
.card-title{font-size:1.25rem}
.detail-actions{flex-direction:row}
.action-btn{flex:1}
}
@media(min-width:900px){
.site-header{padding:20px 24px}
.search-bar{padding:16px 24px}
.main-layout{display:grid;grid-template-columns:280px 1fr;gap:20px;padding:20px;max-width:1200px}
.filter-toggle-bar{display:none}
.filter-panel{display:block;margin-bottom:0;position:sticky;top:140px;max-height:calc(100vh - 160px);overflow-y:auto}
.city-grid{grid-template-columns:repeat(2,1fr)}
.quality-grid{grid-template-columns:repeat(2,1fr)}
.result-cards{display:grid;grid-template-columns:repeat(2,1fr)}
.site-footer{padding:30px 24px}
.detail-nav{padding:16px 24px 0}
.detail-header{padding:32px 28px}
.detail-title{font-size:2rem}
.detail-body{padding:20px 24px}
.detail-card{padding:24px 24px}
}
@media(min-width:1200px){.result-cards{grid-template-columns:repeat(3,1fr)}}
/* Views */
.view{display:none}
.view.active{display:block}
</style>
</head>

typeGrid.innerHTML='';
const allTypeBtn=document.createElement("div");
allTypeBtn.className="type-chip"+(state.type==="全部类型"?" active":"");
allTypeBtn.textContent="📋 全部";
allTypeBtn.onclick=()=>{state.type="全部类型";renderAll()};
typeGrid.appendChild(allTypeBtn);
TYPE_LIST.forEach(t=>{
const b=document.createElement("div");
b.className="type-chip"+(state.type===t?" active":"");
b.textContent=t;
b.onclick=()=>{state.type=t;renderAll()};
typeGrid.appendChild(b);
});

// 城市
const cityGrid=document.getElementById("cityGrid");
cityGrid.innerHTML='';
const allBtn=document.createElement("div");
allBtn.className="city-chip"+(state.city==="全部城市"?" active":"");
allBtn.textContent="🌐 全部";
allBtn.onclick=()=>{state.city="全部城市";renderAll()};
cityGrid.appendChild(allBtn);
CITY_LIST.forEach(c=>{
const b=document.createElement("div");
b.className="city-chip"+(c=="桂林市"?"guilin ":"")+(state.city===c?" active":"");
b.textContent=(c=="桂林市"?"★":"")+c;
b.onclick=()=>{state.city=c;renderAll()};
cityGrid.appendChild(b);
});

// 分类
const catList=document.getElementById("categoryList");
catList.innerHTML='';
Object.keys(CATEGORIES).forEach(cat=>{
const label=document.createElement("label");
label.className="category-item";
const input=document.createElement("input");
input.type="checkbox";
input.checked=state.categories.has(cat);
input.onchange=()=>{state.categories.has(cat)?state.categories.delete(cat):state.categories.add(cat);updateFilterCount();doFilter()};
const span=document.createElement("span");
span.textContent=cat;
label.appendChild(input);
label.appendChild(span);
catList.appendChild(label);
});

// 品质
const qGrid=document.getElementById("qualityGrid");
qGrid.innerHTML='';
ALL_QUALITY_KEYWORDS.slice(0,36).forEach(q=>{
const label=document.createElement("label");
label.className="quality-item";
const input=document.createElement("input");
input.type="checkbox";
input.checked=state.qualities.has(q);
input.onchange=()=>{state.qualities.has(q)?state.qualities.delete(q):state.qualities.add(q);updateFilterCount();doFilter()};
const span=document.createElement("span");
span.textContent=q;
label.appendChild(input);
label.appendChild(span);
qGrid.appendChild(label);
});
}

function updateFilterCount(){
let count=state.categories.size+state.qualities.size;
if(state.type!=="全部类型")count++;
if(state.city!=="全部城市")count++;
document.getElementById("filterCount").textContent=count;
}

// ============ 筛选逻辑 ============
function doFilter(){
log.group('doFilter()');
const kw=state.keyword.toLowerCase();
log.info('doFilter','筛选条件',{type:state.type,city:state.city,keyword:kw,categories:[...state.categories],qualities:[...state.qualities]});

const beforeCount=DATABASE.length;
filteredData=DATABASE.filter(item=>{
if(state.type!=="全部类型"&&item.type!==state.type)return false;
if(state.city!=="全部城市"&&item.city!==state.city)return false;
if(state.categories.size>0&&!state.categories.has(item.category))return false;
if(state.qualities.size>0&&!item.qualities.some(q=>state.qualities.has(q)))return false;
if(kw){
const text=(item.type+item.city+item.site+item.event+item.qualities.join(" ")+item.interpretation).toLowerCase();
if(!text.includes(kw))return false;
}
return true;
});
log.ok('doFilter','筛选完成',{总数:beforeCount,匹配数:filteredData.length,筛掉数:beforeCount-filteredData.length});

// 检查数据完整性
const missingInspire=filteredData.filter(d=>!d.inspire);
if(missingInspire.length>0)log.warn('doFilter','部分条目缺少inspire字段',{count:missingInspire.length,sites:missingInspire.map(d=>d.site)});
const missingInterp=filteredData.filter(d=>!d.interpretation);
if(missingInterp.length>0)log.warn('doFilter','部分条目缺少interpretation字段',{count:missingInterp.length,sites:missingInterp.map(d=>d.site)});

renderResults();
log.groupEnd();
}

function renderResults(){
log.group('renderResults()');
const cards=document.getElementById("resultCards");
const count=document.getElementById("resultCount");
const tags=document.getElementById("filterTags");

if(!cards||!count||!tags){
log.error('renderResults','DOM元素缺失',{cards:!!cards,count:!!count,tags:!!tags});
log.groupEnd();
return;
}

count.textContent=filteredData.length;
log.info('renderResults','结果数量已更新',{count:filteredData.length});

// 筛选标签
let tagHTML="";
if(state.type!=="全部类型")tagHTML+=`<span class="filter-tag">类型：${state.type}</span>`;
if(state.city!=="全部城市")tagHTML+=`<span class="filter-tag">城市：${state.city}</span>`;
if(state.keyword)tagHTML+=`<span class="filter-tag">搜索：「${state.keyword}」</span>`;
tags.innerHTML=tagHTML;
log.ok('renderResults','筛选标签渲染完成',{tagCount:tagHTML?tagHTML.split('filter-tag').length-1:0});

// 渲染卡片
if(filteredData.length===0){
log.warn('renderResults','无匹配结果，显示空状态');
cards.innerHTML='<div class="no-results"><div class="no-results-icon">🔍</div><h3>未找到匹配的红色文化资源</h3><p>请尝试调整筛选条件或搜索关键词</p></div>';
log.groupEnd();
return;
}

log.info('renderResults',`开始渲染 ${filteredData.length} 张卡片`);
cards.innerHTML='';
let keyCount=0;
filteredData.forEach((item,idx)=>{
const realIdx=DATABASE.indexOf(item);
if(realIdx===-1){
log.error('renderResults','无法在DATABASE中找到条目索引',{idx,item:item.site});
return;
}
const card=document.createElement("div");
card.className="result-card"+(item.is_key?" key-resource":"");
if(item.is_key)keyCount++;
card.onclick=()=>showDetail(realIdx);
const qualHTML=item.qualities.slice(0,4).map(q=>`<span class="quality-tag">${q}</span>`).join("");
const more=item.qualities.length>4?`<span class="quality-tag more">+${item.qualities.length-4}</span>`:"";
card.innerHTML=`
<div class="card-header">
<span class="card-city">📍 ${item.city}</span>
<span class="card-type-tag">${item.type||'红色遗址'}</span>
${item.is_key?'<span class="card-key-tag">★课题核心</span>':''}
<span class="card-cat-tag">${item.category}</span>
</div>
<h2 class="card-title">🏛️ ${item.site}</h2>
<p class="card-event">📌 ${item.event}</p>
<div class="card-qualities">${qualHTML}${more}</div>
<p class="card-desc">${item.interpretation.slice(0,80)}${item.interpretation.length>80?'...':''}</p>
<span class="card-action">查看详情 →</span>`;
cards.appendChild(card);
});
log.ok('renderResults','卡片渲染完成',{total:filteredData.length,keyResources:keyCount,normal:filteredData.length-keyCount});
log.groupEnd();
}

// ============ 日志系统（兼容旧浏览器） ============
var DEBUG=true;
var log={
  _ts:function(){return new Date().toLocaleTimeString('zh-CN',{hour12:false})+'.'+String(Date.now()%1000).padStart(3,'0')},
  info:function(tag,msg,data){if(DEBUG)console.log('[ℹ️ '+tag+']',msg,data!=null?data:'')},
  ok:function(tag,msg,data){if(DEBUG)console.log('[✅ '+tag+']',msg,data!=null?data:'')},
  warn:function(tag,msg,data){if(DEBUG)console.warn('[⚠️ '+tag+']',msg,data!=null?data:'')},
  error:function(tag,msg,data){if(DEBUG)console.error('[❌ '+tag+']',msg,data!=null?data:'')},
  group:function(title){if(DEBUG){try{console.groupCollapsed('[📂 '+title+']')}catch(e){console.log('--- '+title+' ---')}}},
  groupEnd:function(){if(DEBUG){try{console.groupEnd()}catch(e){}}}
};

// ============ 详情页 ============
function showDetail(id){
log.group(`showDetail(id=${id})`);
log.info('showDetail','开始加载详情页',{id});

const item=DATABASE[id];
if(!item){
log.error('showDetail','DATABASE 中未找到该条目',{id,DBLength:DATABASE.length});
log.groupEnd();
return;
}
log.ok('showDetail','条目查找成功',{
  id:id,
  type:item.type,
  site:item.site,
  city:item.city,
  is_key:item.is_key,
  qualCount:item.qualities.length,
  hasInspire:!!item.inspire,
  interpLen:item.interpretation?.length||0
});
currentDetailId=id;

// 头部
log.info('showDetail','开始渲染头部');
const dh=document.getElementById("detailHeader");
if(!dh){log.error('showDetail','DOM元素缺失: detailHeader');log.groupEnd();return;}
dh.className="detail-header"+(item.is_key?" key-header":"");
log.ok('showDetail','头部class设置',{className:dh.className});

document.getElementById("breadcrumb").textContent=`${item.city} › ${item.event}`;
const tags=document.getElementById("detailTags");
tags.innerHTML=`<span class="tag-city">📍 ${item.city}</span><span class="tag-type">${item.type||'红色遗址'}</span>${item.is_key?'<span class="tag-key">★课题核心</span>':''}<span class="tag-cat">${item.category}</span>`;
log.ok('showDetail','标签渲染完成',{tagsHTML:tags.innerHTML});

document.getElementById("detailTitle").textContent=`🏛️ ${item.site}`;
document.getElementById("detailEvent").textContent=`📌 ${item.event}`;

// 三段式解读
log.info('showDetail','开始渲染三段式解读');
const interpEl=document.getElementById("detailInterp");
const qualTextEl=document.getElementById("detailQualText");
const inspireEl=document.getElementById("detailInspire");

if(!interpEl||!qualTextEl||!inspireEl){
log.error('showDetail','三段式DOM元素缺失',{interpEl:!!interpEl,qualTextEl:!!qualTextEl,inspireEl:!!inspireEl});
}else{
interpEl.textContent=item.interpretation;
qualTextEl.textContent=item.qualities.join("、");
const inspireText=item.inspire||"学习先辈精神，在学习和工作中坚守信念、直面困难，培养坚韧不拔的积极心理品质。";
inspireEl.textContent=inspireText;
log.ok('showDetail','三段式解读渲染完成',{
  '史实简述':item.interpretation?.slice(0,30)+'...',
  '品质映射':item.qualities.join("、"),
  '现实启示':inspireText.slice(0,30)+'...'
});
}

// 品质徽章
log.info('showDetail','开始渲染品质徽章');
const qc=document.getElementById("detailQualities");
if(!qc){log.error('showDetail','DOM元素缺失: detailQualities');}
else{
qc.innerHTML=item.qualities.map(q=>`<span class="qual-badge">${q}</span>`).join("");
log.ok('showDetail','品质徽章渲染完成',{count:item.qualities.length,badges:item.qualities});
}

// 价值
const valueEl=document.getElementById("detailValue");
const valueText=CATEGORY_DESCRIPTIONS[item.category]||"为大学生积极心理品质培育提供本土化精神滋养。";
valueEl.textContent=valueText;
log.ok('showDetail','课题应用价值渲染完成',{category:item.category,valueLen:valueText.length});

// 同城推荐
log.info('showDetail','开始计算同城推荐');
const related=DATABASE.filter(d=>d.city===item.city&&d.site!==item.site);
const rs=document.getElementById("relatedSection");
log.info('showDetail','同城推荐数量',{city:item.city,count:related.length});
if(related.length>0){
rs.style.display="";
const rl=document.getElementById("relatedList");
rl.innerHTML=related.map(r=>`<div class="related-item" onclick="showDetail(${DATABASE.indexOf(r)})"><span class="related-site">🏛️ ${r.site}</span><span class="related-meta">${r.event} | ${r.category}</span><span class="related-arrow">→</span></div>`).join("");
log.ok('showDetail','同城推荐渲染完成',{items:related.map(r=>r.site)});
}else{
rs.style.display="none";
log.info('showDetail','无同城推荐，隐藏该区域');
}

// 分类筛选按钮
document.getElementById("filterByCategory").textContent=`查看「${item.category}」全部资源`;
log.ok('showDetail','分类筛选按钮设置完成');

// 切换视图
log.info('showDetail','切换视图: 列表→详情');
document.getElementById("listView").classList.remove("active");
document.getElementById("detailView").classList.add("active");
window.scrollTo(0,0);
log.ok('showDetail',`详情页加载完成: ${item.site}`);
log.groupEnd();
}

function showList(){
log.info('showList','返回列表视图');
document.getElementById("detailView").classList.remove("active");
document.getElementById("listView").classList.add("active");
window.scrollTo(0,0);
log.ok('showList','列表视图已激活');
}

function filterByCategory(){
log.group('filterByCategory()');
if(currentDetailId<0){
log.warn('filterByCategory','currentDetailId无效，终止操作');
log.groupEnd();
return;
}
const item=DATABASE[currentDetailId];
log.info('filterByCategory','从详情页触发分类筛选',{site:item.site,category:item.category});
state.categories.clear();
state.categories.add(item.category);
log.ok('filterByCategory','已设置分类筛选',{categories:[...state.categories]});
renderAll();
showList();
log.ok('filterByCategory','筛选完成并返回列表');
log.groupEnd();
}

// ============ 搜索/筛选操作 ============
function doSearch(){
state.keyword=document.getElementById("searchInput").value.trim();
log.info('doSearch','搜索触发',{keyword:state.keyword,kwLen:state.keyword.length});
doFilter();
}

function resetFilters(){
log.group('resetFilters()');
log.info('resetFilters','重置前状态',{type:state.type,city:state.city,keyword:state.keyword,categories:[...state.categories],qualities:[...state.qualities]});
state={type:"全部类型",city:"全部城市",keyword:"",categories:new Set(),qualities:new Set()};
document.getElementById("searchInput").value="";
log.ok('resetFilters','状态已重置');
renderAll();
log.ok('resetFilters','重置完成');
log.groupEnd();
}

function toggleFilter(){
const panel=document.getElementById("filterPanel");
const willShow=!panel.classList.contains("show");
panel.classList.toggle("show");
log.info('toggleFilter',willShow?'打开筛选面板':'关闭筛选面板');
}

function renderAll(){
log.group('renderAll()');
log.info('renderAll','开始全量渲染',{type:state.type,city:state.city,keyword:state.keyword,categories:[...state.categories],qualities:[...state.qualities]});
renderFilters();
updateFilterCount();
doFilter();
log.ok('renderAll','全量渲染完成');
log.groupEnd();
}

// 回车搜索
document.getElementById("searchInput").addEventListener("keypress",e=>{
if(e.key==="Enter"){
log.info('搜索框','检测到回车键，触发搜索');
doSearch();
}
});

// 初始化
log.group('初始化');
log.info('初始化','开始加载应用');
log.info('初始化','数据库统计',{
  总条目:DATABASE.length,
  红色遗址:DATABASE.filter(d=>!d.type||d.type==="红色遗址").length,
  重大历史事件:DATABASE.filter(d=>d.type==="重大历史事件").length,
  红色人物:DATABASE.filter(d=>d.type==="红色人物").length,
  课题核心:DATABASE.filter(d=>d.is_key).length,
  有inspire:DATABASE.filter(d=>d.inspire).length,
  无inspire:DATABASE.filter(d=>!d.inspire).length
});
log.info('初始化','城市列表',{cities:CITY_LIST,count:CITY_LIST.length});
log.info('初始化','类型列表',{types:TYPE_LIST});

document.getElementById("totalCount").textContent=DATABASE.length;
log.ok('初始化','总数已更新',{total:DATABASE.length});

renderAll();
log.ok('初始化','应用加载完成');
log.groupEnd();

// 注册Service Worker实现PWA
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js')
      .then(registration => {
        console.log('Service Worker 注册成功:', registration.scope);
      })
      .catch(err => {
        console.log('Service Worker 注册失败:', err);
      });
  });
}
</script>
